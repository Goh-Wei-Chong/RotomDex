<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ed625c" />
    <meta
      name="description"
      content="Meet your new field companion. Explore all 1,025 Pokémon, discover Paldea, and compare Pokémon stats with custom IVs, EVs, levels, and natures."
    />
    <title>Rotom Dex — A little spark. A world to discover.</title>
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/rotom.css" />
    <link rel="stylesheet" href="style/games-modern.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#pokedex" aria-label="Rotom Dex home"
          ><img src="public/favicon.svg" alt="" width="39" height="43" /><span
            >rotom<span class="brand-light">dex</span
            ><span class="brand-dot">.</span></span
          ></a
        >
        <nav class="main-nav" aria-label="Main navigation">
          <a href="#pokedex" data-nav="pokedex"
            ><svg viewBox="0 0 24 24">
              <path
                d="M4 5h6a3 3 0 0 1 3 3v13a4 4 0 0 0-4-3H4zM20 5h-4a3 3 0 0 0-3 3v13a4 4 0 0 1 4-3h3z"
              /></svg
            >Pokédex</a
          >
          <a href="#compare" data-nav="compare"
            ><svg viewBox="0 0 24 24">
              <path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4" /></svg
            >Compare<span id="nav-compare-count" hidden>0</span></a
          >
          <a href="#games" data-nav="games"
            ><svg viewBox="0 0 24 24">
              <path
                d="m8 7 8 0c3 0 4 4 5 9 .4 3-2 4-4 2l-2-2H9l-2 2c-2 2-4.4 1-4-2C4 11 5 7 8 7ZM8 10v5m-2.5-2.5h5m5-1h.01m2 2h.01"
              /></svg
            >Play</a
          >
        </nav>
        <div class="header-status">
          <span class="status-dot"></span> Adventure ready
          <span class="header-zap">ϟ</span>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading-state">
        <span class="loading-orb"></span>Waking up your Rotom Dex…
      </div>
    </main>
    <footer class="site-footer">
      <div>
        <a class="footer-brand" href="#pokedex">rotomdex<span>.</span></a
        ><span>A little curiosity goes a long way.</span>
      </div>
      <p>
        An unofficial fan project. Pokémon © Nintendo / Creatures / GAME
        FREAK.<br />Pokémon data & artwork via
        <a href="https://pokeapi.co/" target="_blank" rel="noreferrer"
          >PokéAPI</a
        >.
      </p>
      <a href="#main" class="back-top" aria-label="Back to top">↑</a>
    </footer>
    <div id="compare-tray"></div>
    <div id="toast" class="toast" role="status"></div>
    <dialog
      id="pokemon-dialog"
      class="pokemon-dialog"
      aria-label="Pokémon details"
    ></dialog>
  </body>
</html>
